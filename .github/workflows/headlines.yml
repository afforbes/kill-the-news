name: Update headlines

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/headlines.yml']

permissions:
  contents: write

concurrency:
  group: headlines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-headlines.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain headlines.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add headlines.json
            git commit -m "Update headlines"
            git push
          else
            echo "No changes"
          fi
